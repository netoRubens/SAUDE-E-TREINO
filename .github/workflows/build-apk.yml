name: Gerar APK Android
on:
  workflow_dispatch:
    inputs:
      atualizacao_automatica:
        description: 'Atualização automática: o app carrega o site publicado (GitHub Pages). Desmarque para embutir tudo no APK.'
        type: boolean
        default: true
      site_url:
        description: 'URL do site (opcional). Vazio = https://SEU-USUARIO.github.io/SEU-REPOSITORIO/'
        type: string
        default: ''
      usar_dexie:
        description: 'Usar o Dexie.js real (false = substituto compatível, o motor testado nesta versão)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Baixar o Dexie.js real (opcional)
        if: ${{ inputs.usar_dexie }}
        run: sh scripts/get-dexie.sh
      - name: Instalar dependências do app Android
        working-directory: android-app
        run: npm install --legacy-peer-deps
      - name: Montar o projeto Android
        working-directory: android-app
        env:
          BUILD_NUMBER: '${{ github.run_number }}'
          AUTO: '${{ inputs.atualizacao_automatica }}'
          SITE_URL: '${{ inputs.site_url }}'
          OWNER: '${{ github.repository_owner }}'
          NAME: '${{ github.event.repository.name }}'
        run: |
          node scripts/build-www.mjs
          node scripts/configure-source.mjs
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Usar a chave de assinatura fixa (permite atualizar o app sem desinstalar)
        run: mkdir -p ~/.android && cp android-app/debug.keystore ~/.android/debug.keystore
      - name: Compilar o APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nomear o APK e calcular o checksum
        id: n
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}-b${{ github.run_number }}"
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "dist/satori-${TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256.txt)
          awk -v v="$VER" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \\[/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Satori $VER" > notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: satori-apk, path: dist/ }
      - name: Publicar em Releases (link de download)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release create "${{ steps.n.outputs.tag }}" dist/* --title "Satori ${{ steps.n.outputs.tag }}" --notes-file notes.md
